name: pdf2zh-acceptance

services:
  init:
    volumes: !override
      - "${PDF2ZH_ACCEPTANCE_ROOT:?set a disposable absolute acceptance root}/data/jobs:/data/jobs"
      - "${PDF2ZH_ACCEPTANCE_ROOT:?set a disposable absolute acceptance root}/data/state:/data/state"
      - "${PDF2ZH_ACCEPTANCE_ROOT:?set a disposable absolute acceptance root}/secrets/web:/run/pdf2zh-init-secrets/web"
      - "${PDF2ZH_ACCEPTANCE_ROOT:?set a disposable absolute acceptance root}/secrets/worker:/run/pdf2zh-init-secrets/worker"

  translator:
    volumes: !override
      - "${PDF2ZH_ACCEPTANCE_ROOT:?set a disposable absolute acceptance root}/data/jobs:/data/jobs"
      - "${PDF2ZH_ACCEPTANCE_ROOT:?set a disposable absolute acceptance root}/secrets/worker:/run/pdf2zh-secrets:ro"

  web:
    ports: !override
      - "127.0.0.1:${PDF2ZH_ACCEPTANCE_PORT:-17860}:7860"
    volumes: !override
      - "${PDF2ZH_ACCEPTANCE_ROOT:?set a disposable absolute acceptance root}/data/jobs:/data/jobs"
      - "${PDF2ZH_ACCEPTANCE_ROOT:?set a disposable absolute acceptance root}/data/state:/data/state"
      - "${PDF2ZH_ACCEPTANCE_ROOT:?set a disposable absolute acceptance root}/secrets/web:/run/pdf2zh-secrets:ro"
