user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Resolve the application container again after a rolling restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name 185.99.135.224;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
            access_log off;
        }

        location / {
            return 308 https://185.99.135.224:7860$request_uri;
        }
    }

    server {
        listen 7860 ssl default_server;
        listen [::]:7860 ssl default_server;
        server_name 185.99.135.224;

        ssl_certificate /etc/letsencrypt/live/185.99.135.224/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/185.99.135.224/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:PDF2ZH_TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

        # Rust accepts a 100 MiB PDF plus bounded multipart framing.
        client_max_body_size 102m;
        client_body_timeout 300s;

        location / {
            set $pdf2zh_upstream http://web:7860;
            proxy_pass $pdf2zh_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # Never preserve a client-supplied chain: the private Rust service
            # trusts this value for authentication abuse throttling.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 3600s;
        }
    }
}
