name: pdf2zh-next

services:
  storage-init:
    image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    user: "0:0"
    command:
      - sh
      - -c
      - chown -R 10001:10001 /data/jobs /data/state
    restart: "no"
    volumes:
      - jobs:/data/jobs
      - web-state:/data/state

  translator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    image: pdf2zh-next-translator:${PDF2ZH_APP_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 8g
    pids_limit: 512
    cap_drop:
      - ALL
    cap_add:
      # The root supervisor immediately drops Uvicorn to 10001:10001. KILL is
      # retained only by the supervisor so it can destroy that different-UID
      # process group; the exec'd child has no permitted/effective caps.
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8000"
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Shanghai
      PDF2ZH_DATA_ROOT: /data/jobs
      PDF2ZH_WORKER_TOKEN: ${PDF2ZH_WORKER_TOKEN:?set PDF2ZH_WORKER_TOKEN}
      PDF2ZH_PUBLIC_WORKER_MODE: "1"
      PDF2ZH_MAX_ACTIVE_JOBS: "1"
      PDF2ZH_WORKER_JOB_RETENTION_SECONDS: "${PDF2ZH_WORKER_JOB_RETENTION_SECONDS:-21600}"
      PDF2ZH_WORKER_MAX_JOURNAL_EVENTS: "10000"
      PDF2ZH_CANCEL_HARD_TIMEOUT_SECONDS: "${PDF2ZH_CANCEL_HARD_TIMEOUT_SECONDS:-75}"
      PDF2ZH_SUPERVISOR_FAILURE_LIMIT: "${PDF2ZH_SUPERVISOR_FAILURE_LIMIT:-18}"
      PDF2ZH_SUPERVISOR_CHILD_STOP_SECONDS: "${PDF2ZH_SUPERVISOR_CHILD_STOP_SECONDS:-45}"
    volumes:
      - jobs:/data/jobs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,os,urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8000/internal/health',headers={'x-worker-token':os.environ['PDF2ZH_WORKER_TOKEN']});
          p=json.load(urllib.request.urlopen(r,timeout=3));
          assert p['status']=='ok' and p['provider']=='google' and p['max_active_jobs']==1 and p['epoch'] and p['container_boot_id']"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pdf2zh-next-web:${PDF2ZH_APP_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    # A shutdown can spend one reconciliation window plus one worker recycle
    # window proving that the old translation cgroup is gone.
    stop_grace_period: 360s
    mem_limit: 1g
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      translator:
        condition: service_healthy
    expose:
      - "7860"
    environment:
      TZ: Asia/Shanghai
      PORT: "7860"
      PDF2ZH_DATA_ROOT: /data/jobs
      PDF2ZH_STATE_ROOT: /data/state
      PDF2ZH_FRONTEND_DIR: /app/frontend
      PDF2ZH_WORKER_URL: http://translator:8000
      PDF2ZH_WORKER_TOKEN: ${PDF2ZH_WORKER_TOKEN:?set PDF2ZH_WORKER_TOKEN}
      PDF2ZH_PUBLIC_ORIGIN: "${PDF2ZH_PUBLIC_ORIGIN:-https://185.99.135.224:7860}"
      PDF2ZH_SECURE_COOKIES: "${PDF2ZH_SECURE_COOKIES:-true}"
      # The web port is private and the gateway replaces (never appends) XFF.
      PDF2ZH_TRUST_X_FORWARDED_FOR: "true"
      PDF2ZH_MASTER_KEY_FILE: /run/secrets/pdf2zh_master_key
      PDF2ZH_SETUP_TOKEN_FILE: /run/secrets/pdf2zh_setup_token
      PDF2ZH_CONCURRENCY: "1"
      PDF2ZH_MAX_ACTIVE_JOBS: "1"
      PDF2ZH_MAX_UPLOAD_BYTES: "104857600"
      PDF2ZH_UPLOAD_TIMEOUT_SECONDS: "${PDF2ZH_UPLOAD_TIMEOUT_SECONDS:-300}"
      PDF2ZH_LEASE_SECONDS: "${PDF2ZH_LEASE_SECONDS:-180}"
      PDF2ZH_RELEASE_GRACE_SECONDS: "${PDF2ZH_RELEASE_GRACE_SECONDS:-15}"
      PDF2ZH_CANCEL_RECONCILE_SECONDS: "${PDF2ZH_CANCEL_RECONCILE_SECONDS:-120}"
      PDF2ZH_WORKER_RECYCLE_SECONDS: "${PDF2ZH_WORKER_RECYCLE_SECONDS:-180}"
      PDF2ZH_TERMINAL_RETENTION_SECONDS: "21600"
      PDF2ZH_ID_TOMBSTONE_SECONDS: "${PDF2ZH_ID_TOMBSTONE_SECONDS:-21600}"
    volumes:
      - jobs:/data/jobs
      - web-state:/data/state
    secrets:
      - source: pdf2zh_master_key
        target: pdf2zh_master_key
      - source: pdf2zh_setup_token
        target: pdf2zh_setup_token
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7860/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  gateway:
    profiles: ["tls"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: pdf2zh-next-gateway:${PDF2ZH_GATEWAY_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "${PDF2ZH_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${PDF2ZH_BIND_ADDRESS:-0.0.0.0}:${PDF2ZH_PORT:-7860}:7860"
    environment:
      PDF2ZH_NGINX_RELOAD_SECONDS: "${PDF2ZH_NGINX_RELOAD_SECONDS:-300}"
    command: ["/bin/sh", "/etc/nginx/pdf2zh-reload-loop.sh"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./nginx.vps.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-reload-loop.sh:/etc/nginx/pdf2zh-reload-loop.sh:ro
      - ${PDF2ZH_LETSENCRYPT_ROOT:-/docker/pdf2zh-rust/tls/letsencrypt}:/etc/letsencrypt:ro
      - ${PDF2ZH_ACME_WEBROOT:-/docker/pdf2zh-rust/tls/www}:/var/www/certbot:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          served=/tmp/pdf2zh-served-cert.pem
          && rm -f "$$served"
          && openssl s_client -connect 127.0.0.1:7860
          -servername 185.99.135.224 -showcerts </dev/null 2>/dev/null
          | openssl x509 -out "$$served"
          && openssl x509 -checkend 86400 -noout -in "$$served"
          && test "$$(openssl x509 -sha256 -fingerprint -noout -in "$$served")"
          = "$$(openssl x509 -sha256 -fingerprint -noout
          -in /etc/letsencrypt/live/185.99.135.224/fullchain.pem)"
          && curl --fail --silent --show-error
          --noproxy '*'
          --resolve 185.99.135.224:7860:127.0.0.1
          https://185.99.135.224:7860/api/health >/dev/null
          && rm -f "$$served"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  certbot:
    profiles: ["tls"]
    image: certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    init: true
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/pdf2zh-certbot-renew-loop"]
    command: []
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${PDF2ZH_LETSENCRYPT_ROOT:-/docker/pdf2zh-rust/tls/letsencrypt}:/etc/letsencrypt
      - ${PDF2ZH_ACME_WEBROOT:-/docker/pdf2zh-rust/tls/www}:/var/www/certbot
      - certbot-state:/var/lib/letsencrypt
      - ./certbot-renew-loop.sh:/usr/local/bin/pdf2zh-certbot-renew-loop:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /var/lib/letsencrypt/pdf2zh-last-success
          && test -s /etc/letsencrypt/live/185.99.135.224/fullchain.pem
          && openssl x509 -checkend 86400 -noout
          -in /etc/letsencrypt/live/185.99.135.224/fullchain.pem
          && test -s /etc/letsencrypt/live/185.99.135.224/privkey.pem
          && test -s /etc/letsencrypt/renewal/185.99.135.224.conf
          && last=$$(cat /var/lib/letsencrypt/pdf2zh-last-success)
          && now=$$(date +%s)
          && test $$((now - last)) -lt 90000
      interval: 1m
      timeout: 10s
      retries: 2
      start_period: 2m

volumes:
  jobs:
  web-state:
  certbot-state:

secrets:
  pdf2zh_master_key:
    file: ${PDF2ZH_MASTER_KEY_FILE_HOST:-/docker/pdf2zh-rust/secrets/provider-master-key}
  pdf2zh_setup_token:
    file: ${PDF2ZH_SETUP_TOKEN_FILE_HOST:-/docker/pdf2zh-rust/secrets/admin-setup-token}
