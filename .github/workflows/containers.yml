name: Test and publish portable containers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-test:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          activate-environment: true
      - name: Install all dependency groups
        run: uv sync --all-groups
      - name: Lint Python
        run: >-
          uv run ruff check pdf2zh_next tests test/test_cache.py
          script/portable_compose_regression.py
          script/vps_admin_no_paid_regression.py
          script/vps_rust_api_regression.py
          script/vps_worker_failstop_regression.py
      - name: Run Python tests
        run: uv run pytest -q tests test/test_cache.py
      - name: Build Python package
        run: uv build

  rust-test:
    name: Rust checks and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the production Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +1.96.0 fmt --all -- --check
      - name: Run Clippy
        run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo +1.96.0 test --locked --all-targets

  frontend-test:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  portable-test:
    name: Portable Compose and bootstrap tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the zero-configuration Compose and README copy
        run: python3 script/portable_compose_regression.py
      - name: Build the initialization image
        run: docker build --file deploy/Dockerfile.ops --tag pdf2zh-ops:test .
      - name: Verify first start, idempotency, and fail-closed recovery
        run: bash script/portable_init_regression.sh

  prepare:
    name: Prepare GHCR release
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'FengYuchen1314/PDFMathTranslate-next'
    needs: [python-test, rust-test, frontend-test, portable-test]
    runs-on: ubuntu-24.04
    outputs:
      prefix: ${{ steps.image-prefix.outputs.prefix }}
    steps:
      - id: image-prefix
        name: Normalize the GHCR path
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "prefix=ghcr.io/${repository}" >>"${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.component }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: ./Dockerfile
          - component: web
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: ./Dockerfile
          - component: translator
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: ./deploy/Dockerfile.worker
          - component: translator
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: ./deploy/Dockerfile.worker
          - component: ops
            arch: amd64
            runner: ubuntu-24.04
            dockerfile: ./deploy/Dockerfile.ops
          - component: ops
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: ./deploy/Dockerfile.ops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build and push by digest
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          outputs: type=image,name=${{ needs.prepare.outputs.prefix }}-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
      - name: Save image digest
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest='${{ steps.image.outputs.digest }}'
          test -n "${digest}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.component }} commit manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [web, translator, ops]
    steps:
      - name: Download architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-${{ matrix.component }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Create the multi-architecture commit tag
        shell: bash
        run: |
          set -euo pipefail
          image='${{ needs.prepare.outputs.prefix }}-${{ matrix.component }}'
          mapfile -t digests < <(
            find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f -printf '%f\n' | sort
          )
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${image}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${image}:sha-${GITHUB_SHA}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA}"
